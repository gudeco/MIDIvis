<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>MIDI Visualizer</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Marcellus&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#081218;
    --bg2:#0d1921;
    --panel:#0e1b24cc;
    --panel-solid:#0d1821;
    --panel2:#142635dd;
    --text:#dcecf0;
    --muted:#9bb0bb;
    --border:#ffffff10;
    --accent:#7B1B38;
    --accent-2:#b84b6d;
    --accent-3:#5c142a;

    --field-top:#09141c;
    --field-mid:#10222d;
    --field-bottom:#162d39;

    --lane-major:#d8f1ff1e;
    --lane-minor:#c8eaff10;
    --grid-major:#e8fbff2a;
    --grid-minor:#dff6ff12;

    --strike:#65152f;
    --strike-bright:#a63a5d;

    --white-key:#e9efef;
    --white-key-2:#d7e2e2;
    --white-key-active-1:#7B1B38;
    --white-key-active-2:#b44b69;

    --black-key-1:#0d1316;
    --black-key-2:#030608;
    --black-key-active-1:#4a0f22;
    --black-key-active-2:#8e2847;

    --note-1:#4d7e97;
    --note-2:#74b2c4;
    --note-3:#365b70;
    --note-hi-1:#a6ebe2;
    --note-hi-2:#ddfff8;
    --note-hi-3:#76cad1;

    --status-bg:#08141bcc;
    --shadow:#00000066;
  }

  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{
    display:flex;flex-direction:column;
    color:var(--text);
    font-family:"Inter", Arial, sans-serif;
    letter-spacing:.1px;
    background:
      radial-gradient(1200px 650px at 50% 115%, #6f325022 0%, transparent 45%),
      radial-gradient(900px 500px at 18% 20%, #75d0d922 0%, transparent 40%),
      radial-gradient(1000px 580px at 82% 16%, #6aa1cf16 0%, transparent 38%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
  }
  body::before{
    content:"";
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(900px 240px at 50% -8%, #ffffff0d 0%, transparent 65%),
      repeating-linear-gradient(
        90deg,
        transparent 0px,
        transparent 19px,
        #ffffff02 20px,
        transparent 21px
      ),
      repeating-linear-gradient(
        0deg,
        transparent 0px,
        transparent 11px,
        #ffffff02 12px
      );
    opacity:.9;
  }
  body::after{
    content:"";
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(500px 120px at 50% 78%, #c4fff212 0%, transparent 70%),
      radial-gradient(680px 240px at 50% 105%, #8bd4dc14 0%, transparent 64%);
    filter: blur(24px);
  }

  #topbar,#bottombar,#main{position:relative; z-index:1}

  #topbar{
    height:60px; min-height:60px;
    display:flex; align-items:center; gap:9px; padding:8px 14px;
    background:linear-gradient(180deg, #173042b8 0%, #10212cb8 100%);
    backdrop-filter: blur(14px) saturate(140%);
    border-bottom:1px solid var(--border);
    box-shadow:0 8px 22px var(--shadow), inset 0 1px #ffffff12;
  }

  .brand{
    font-family:"Marcellus", Georgia, serif;
    font-size:17px;
    letter-spacing:.25px;
    margin-right:8px;
    white-space:nowrap;
    color:#dcecf0;
  }
  .top-stats{
    min-width:280px;
    color:#c8dce2;
    text-shadow:none;
    font-family:"Inter", Arial, sans-serif;
    font-size:12px;
    font-weight:500;
    letter-spacing:.08px;
  }

  .small{
    font-size:12px;
    color:var(--muted);
    white-space:nowrap;
  }

  button,.button,select,input[type="range"]{font:inherit}
  button,.button,select{
    color:#eef3f3;
    background:#050607;
    border:1px solid #2a3034;
    border-radius:0;
    padding:7px 11px;
    box-shadow:
      inset 0 0 0 1px #000,
      inset 0 1px 0 #ffffff08,
      0 1px 0 #000;
    cursor:pointer;
    user-select:none;
    font-family:"Inter", Arial, sans-serif;
    font-size:12px;
    font-weight:600;
    letter-spacing:.55px;
    text-shadow:0 1px 0 #000;
  }
  button:hover,.button:hover,select:hover{
    background:#0a0c0e;
    border-color:#3b4348;
  }
  button:active,.button:active{
    transform:translateY(1px);
    background:#020304;
  }
  input[type=file]{display:none}
  select{
    appearance:auto;
    -webkit-appearance:auto;
  }

  .miniKey{
    min-width:30px;
    padding-left:8px;
    padding-right:8px;
  }

  .sep{
    width:1px; height:28px;
    background:#ffffff08;
    border-right:1px solid #00000026;
    margin:0 1px;
  }

  #speed{width:118px}
  #volume{width:94px}

  #speed,#volume{
    accent-color:#7B1B38;
    appearance:none;
    -webkit-appearance:none;
    height:12px;
    background:transparent;
    cursor:pointer;
  }

  #speed::-webkit-slider-runnable-track,
  #volume::-webkit-slider-runnable-track{
    height:5px;
    background:#030405;
    border:1px solid #25292d;
    border-radius:0;
    box-shadow:inset 0 1px 2px #000;
  }
  #speed::-webkit-slider-thumb,
  #volume::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:10px;
    height:15px;
    margin-top:-6px;
    background:#7B1B38;
    border:1px solid #a33a59;
    border-radius:0;
    box-shadow:0 0 0 1px #21070f, 0 1px 2px #000;
  }

  #speed::-moz-range-track,
  #volume::-moz-range-track{
    height:5px;
    background:#030405;
    border:1px solid #25292d;
    border-radius:0;
    box-shadow:inset 0 1px 2px #000;
  }
  #speed::-moz-range-progress,
  #volume::-moz-range-progress{
    height:5px;
    background:#7B1B38;
    border-radius:0;
  }
  #speed::-moz-range-thumb,
  #volume::-moz-range-thumb{
    width:10px;
    height:15px;
    background:#7B1B38;
    border:1px solid #a33a59;
    border-radius:0;
    box-shadow:0 0 0 1px #21070f, 0 1px 2px #000;
  }

  #speedReadout{
    min-width:44px; text-align:right;
    font-variant-numeric:tabular-nums;
  }

  #main{
    flex:1; min-height:0;
    background:
      radial-gradient(900px 260px at 50% 100%, #65b1b617 0%, transparent 58%),
      linear-gradient(180deg, var(--field-top) 0%, var(--field-mid) 48%, var(--field-bottom) 100%);
  }

  #viz{display:block; width:100%; height:100%}

  #dropHint{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    pointer-events:none;
    font-family:"Marcellus", Georgia, serif;
    font-size:28px; letter-spacing:.4px;
    color:#ddffff70;
    text-shadow:0 2px 8px #000;
  }
  #dropHint.hidden{display:none}


  #bottombar{
    height:74px; min-height:74px;
    padding:10px 14px 9px;
    background:linear-gradient(180deg, #122430c4 0%, #0c1820c8 100%);
    backdrop-filter: blur(14px) saturate(140%);
    border-top:1px solid var(--border);
    box-shadow:0 -8px 22px var(--shadow), inset 0 1px #ffffff0e;
  }

  #progress{
    width:100%; height:16px; margin:0 0 9px;
    accent-color:var(--accent);
  }

  #bottomRow{
    display:flex; align-items:center; gap:12px;
    font-size:12px; color:var(--muted);
  }
  #time{font-variant-numeric:tabular-nums; min-width:128px}
  #moodLine{
    font-family:"Marcellus", Georgia, serif;
    color:#cde7ea;
    letter-spacing:.25px;
  }
  #help{margin-left:auto; color:var(--muted); white-space:nowrap}

  kbd{
    display:inline-block; min-width:20px; text-align:center;
    padding:1px 5px; margin:0 1px;
    border:1px solid #ffffff14;
    border-radius:6px;
    background:#ffffff10;
    box-shadow:inset 0 1px #ffffff18,0 1px #0008;
    color:var(--text);
    font-size:11px;
  }

  @media(max-width:1220px){
    .top-stats{min-width:220px;font-size:11px}
    #help{display:none}
    #topbar{gap:6px}
  }
  @media(max-width:900px){
    #moodLine{display:none}
    #speed{width:84px}
    #volume{width:72px}
  }
</style>
</head>
<body>
  <div id="topbar">
    <div id="topStats" class="brand top-stats">No MIDI loaded</div>
    <label class="button" for="fileInput">Load MIDI</label>
    <input id="fileInput" type="file" accept=".mid,.midi,audio/midi,audio/x-midi" />
    <button id="playBtn" title="Space">▶ Play</button>
    <button id="prevBtn" title="Previous note group">◀ Group</button>
    <button id="nextBtn" title="Next note group">Group ▶</button>
    <div class="sep"></div>
    <span class="small">Speed</span>
    <input id="speed" type="range" min="0.25" max="2.5" step="0.05" value="1" />
    <span id="speedReadout">1.00×</span>
    <button id="slowerBtn" class="miniKey" title="Decrease speed">−</button>
    <button id="fasterBtn" class="miniKey" title="Increase speed">+</button>
    <div class="sep"></div>
    <span class="small">Piano</span>
    <select id="pianoPreset">
      <option value="warmfelt" selected>Warm Felt</option>
      <option value="softgrand">Soft Grand</option>
      <option value="concert">Concert Grand</option>
      <option value="studio">Studio Bright</option>
      <option value="upright">Dark Upright</option>
    </select>
    <span class="small">Vol</span>
    <input id="volume" type="range" min="0" max="1" step="0.01" value="0.78" />
    <span id="pianoStatus" class="small">Grand piano: loading…</span>
  </div>

  <div id="main">
    <canvas id="viz"></canvas>
    <div id="dropHint">Drop a .mid / .midi file here</div>
  </div>

  <div id="bottombar">
    <input id="progress" type="range" min="0" max="1" step="0.001" value="0" />
    <div id="bottomRow">
      <span id="time">0:00.0 / 0:00.0</span>
      <span id="fileName"></span>
      <span id="moodLine"></span>
      <span id="help">
        <kbd>Space</kbd> play/pause · paused: <kbd>←</kbd>/<kbd>→</kbd> previous/next note group · playing: arrows seek ±2 s · <kbd>↑</kbd>/<kbd>↓</kbd> speed
      </span>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/tone@14.9.17/build/Tone.js"></script>
<script>
(() => {
  'use strict';

  const NOTE_MIN = 21;   // A0
  const NOTE_MAX = 108;  // C8
  const WHITE_PCS = new Set([0,2,4,5,7,9,11]);
  const STEP_TOLERANCE_SEC = 0.030;
  const LOOKBACK_PADDING_SEC = 0.05;

  const canvas = document.getElementById('viz');
  const ctx = canvas.getContext('2d');
  const main = document.getElementById('main');
  const fileInput = document.getElementById('fileInput');
  const playBtn = document.getElementById('playBtn');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const speedSlider = document.getElementById('speed');
  const speedReadout = document.getElementById('speedReadout');
  const slowerBtn = document.getElementById('slowerBtn');
  const fasterBtn = document.getElementById('fasterBtn');
  const pianoPreset = document.getElementById('pianoPreset');
  const pianoStatus = document.getElementById('pianoStatus');
  const volumeSlider = document.getElementById('volume');
  const progress = document.getElementById('progress');
  const timeEl = document.getElementById('time');
  const topStats = document.getElementById('topStats');
  const fileNameEl = document.getElementById('fileName');
  const dropHint = document.getElementById('dropHint');

  let midi = null;
  let notes = [];
  let groups = [];
  let tempoMap = [];
  let totalDuration = 0;
  let maxNoteDuration = 1;
  let speed = 1;
  let playhead = 0;
  let playing = false;
  let selectedGroupIndex = -1;
  let stepPitches = new Set();

  let anchorSongTime = 0;
  let anchorAudioTime = 0;
  let nextNoteIndex = 0;

  let sampler = null;
  let samplerReady = false;
  let samplerFailed = false;
  let volume = 0.78;

  let pianoFilter = null;
  let pianoEQ = null;
  let pianoCompressor = null;

  let W = 0, H = 0, dpr = 1;
  let keyboardH = 155;
  let fieldH = 400;
  let pxPerSec = 165;
  let keyLayout = [];
  let whiteKeys = [];
  let blackKeys = [];

  let theme = {};

  const pianoPresets = {
    warmfelt: {
      label: 'Warm Felt',
      filterFreq: 2500,
      eqLow: 3.0, eqMid: -0.5, eqHigh: -10.0,
      threshold: -18, ratio: 2.2,
      release: 1.45,
      volumeTrim: -1.5
    },
    softgrand: {
      label: 'Soft Grand',
      filterFreq: 3600,
      eqLow: 2.0, eqMid: 0.0, eqHigh: -6.0,
      threshold: -18, ratio: 2.4,
      release: 1.35,
      volumeTrim: -1.0
    },
    concert: {
      label: 'Concert Grand',
      filterFreq: 7200,
      eqLow: 1.0, eqMid: 0.2, eqHigh: -1.5,
      threshold: -16, ratio: 2.6,
      release: 1.25,
      volumeTrim: -0.4
    },
    studio: {
      label: 'Studio Bright',
      filterFreq: 12000,
      eqLow: -1.0, eqMid: 0.4, eqHigh: 2.2,
      threshold: -15, ratio: 2.9,
      release: 1.15,
      volumeTrim: 0
    },
    upright: {
      label: 'Dark Upright',
      filterFreq: 2200,
      eqLow: 3.8, eqMid: -1.2, eqHigh: -12.0,
      threshold: -19, ratio: 2.1,
      release: 1.05,
      volumeTrim: -1.2
    }
  };

  function readU16(v, p){ return v.getUint16(p, false); }
  function readU32(v, p){ return v.getUint32(p, false); }

  function parseMidi(arrayBuffer){
    const v = new DataView(arrayBuffer);
    let p = 0;

    const need = n => {
      if (p + n > v.byteLength) throw new Error('Unexpected end of MIDI file.');
    };
    const u8 = () => { need(1); return v.getUint8(p++); };
    const str = n => {
      need(n);
      let s = '';
      for(let i=0;i<n;i++) s += String.fromCharCode(v.getUint8(p++));
      return s;
    };
    const u16 = () => { need(2); const x=readU16(v,p); p+=2; return x; };
    const u32 = () => { need(4); const x=readU32(v,p); p+=4; return x; };
    const vlq = () => {
      let value = 0, count = 0, b;
      do{
        if(++count > 4) throw new Error('Invalid MIDI variable-length value.');
        b = u8();
        value = (value << 7) | (b & 0x7f);
      }while(b & 0x80);
      return value >>> 0;
    };

    if(str(4) !== 'MThd') throw new Error('This is not a Standard MIDI File.');
    const headerLen = u32();
    if(headerLen < 6) throw new Error('Invalid MIDI header.');
    const format = u16();
    const trackCount = u16();
    const division = u16();
    p += headerLen - 6;

    const rawNotes = [];
    const tempos = [];
    const trackNames = [];
    let songEndTick = 0;

    for(let track=0; track<trackCount; track++){
      if(str(4) !== 'MTrk') throw new Error(`Missing MTrk chunk at track ${track+1}.`);
      const len = u32();
      const end = p + len;
      if(end > v.byteLength) throw new Error('Track chunk extends beyond file.');
      let tick = 0;
      let running = null;
      let trackName = `Track ${track+1}`;
      const active = new Map();

      while(p < end){
        tick += vlq();
        songEndTick = Math.max(songEndTick, tick);

        const first = u8();
        let status, data1 = null;

        if(first & 0x80){
          status = first;
          if(status < 0xF0) running = status;
        } else {
          if(running == null) throw new Error('Invalid running status in MIDI track.');
          status = running;
          data1 = first;
        }

        if(status === 0xFF){
          const type = u8();
          const mlen = vlq();
          need(mlen);
          const mstart = p;

          if(type === 0x51 && mlen === 3){
            const usq = (v.getUint8(p)<<16) | (v.getUint8(p+1)<<8) | v.getUint8(p+2);
            tempos.push({tick, usq});
          } else if(type === 0x03 && mlen > 0){
            const bytes = [];
            for(let i=0;i<mlen;i++) bytes.push(v.getUint8(p+i));
            try { trackName = new TextDecoder('utf-8').decode(new Uint8Array(bytes)); }
            catch { trackName = String.fromCharCode(...bytes); }
          }
          p = mstart + mlen;
          continue;
        }

        if(status === 0xF0 || status === 0xF7){
          const slen = vlq();
          p += slen;
          if(p > end) throw new Error('Invalid SysEx event length.');
          running = null;
          continue;
        }

        if(status >= 0xF0){
          const sizes = {0xF1:1,0xF2:2,0xF3:1,0xF6:0,0xF8:0,0xFA:0,0xFB:0,0xFC:0,0xFE:0};
          const count = sizes[status] ?? 0;
          for(let i=0;i<count;i++) u8();
          continue;
        }

        const kind = status & 0xF0;
        const ch = status & 0x0F;
        if(data1 == null) data1 = u8();
        let data2 = null;
        if(kind !== 0xC0 && kind !== 0xD0) data2 = u8();

        if(kind === 0x90 && data2 > 0){
          const note = data1;
          const key = `${ch}:${note}`;
          if(!active.has(key)) active.set(key, []);
          active.get(key).push({tick, velocity:data2, channel:ch, note});
        } else if(kind === 0x80 || (kind === 0x90 && data2 === 0)){
          const note = data1;
          const key = `${ch}:${note}`;
          const q = active.get(key);
          if(q && q.length){
            const on = q.shift();
            rawNotes.push({
              startTick:on.tick, endTick:Math.max(tick, on.tick+1),
              pitch:note, velocity:on.velocity, channel:ch, track, trackName
            });
            if(!q.length) active.delete(key);
          }
        }
      }

      for(const q of active.values()){
        for(const on of q){
          rawNotes.push({
            startTick:on.tick, endTick:Math.max(tick, on.tick+1),
            pitch:on.note, velocity:on.velocity, channel:on.channel, track, trackName
          });
        }
      }

      trackNames.push(trackName);
      p = end;
    }

    let tickToSec;
    const smpte = (division & 0x8000) !== 0;
    let ppq = null;
    let builtTempoMap = [];

    if(!smpte){
      ppq = division & 0x7fff;
      if(!ppq) throw new Error('Invalid ticks-per-quarter-note value.');

      tempos.sort((a,b)=>a.tick-b.tick);
      builtTempoMap = [{tick:0, sec:0, usq:500000}];

      for(const ev of tempos){
        const last = builtTempoMap[builtTempoMap.length-1];
        const secAt = last.sec + (ev.tick-last.tick) * last.usq / ppq / 1e6;
        if(ev.tick === last.tick){
          last.usq = ev.usq;
        } else {
          builtTempoMap.push({tick:ev.tick, sec:secAt, usq:ev.usq});
        }
      }

      tickToSec = tick => {
        let lo=0, hi=builtTempoMap.length-1;
        while(lo < hi){
          const mid = Math.ceil((lo+hi)/2);
          if(builtTempoMap[mid].tick <= tick) lo = mid;
          else hi = mid-1;
        }
        const t = builtTempoMap[lo];
        return t.sec + (tick-t.tick)*t.usq/ppq/1e6;
      };
    } else {
      const fpsByte = (division >> 8) & 0xff;
      const signed = fpsByte >= 128 ? fpsByte - 256 : fpsByte;
      const fps = Math.abs(signed) || 25;
      const ticksPerFrame = division & 0xff;
      const ticksPerSec = fps * ticksPerFrame;
      tickToSec = tick => tick / ticksPerSec;
      builtTempoMap = [{tick:0, sec:0, usq:500000}];
    }

    const cooked = rawNotes
      .filter(n => n.pitch >= 0 && n.pitch <= 127)
      .map(n => ({
        ...n,
        startSec: tickToSec(n.startTick),
        endSec: tickToSec(n.endTick)
      }))
      .map(n => ({...n, endSec: Math.max(n.endSec, n.startSec + 0.02)}))
      .sort((a,b)=>a.startSec-b.startSec || a.pitch-b.pitch);

    const endSec = Math.max(tickToSec(songEndTick), ...cooked.map(n=>n.endSec), 0);

    return {
      format, trackCount, division, ppq, smpte,
      notes:cooked, tempoMap:builtTempoMap, duration:endSec, trackNames
    };
  }

  function buildGroups(){
    groups = [];
    for(const n of notes){
      if(n.pitch < NOTE_MIN || n.pitch > NOTE_MAX) continue;
      const last = groups[groups.length-1];
      if(!last || n.startSec - last.time > STEP_TOLERANCE_SEC){
        groups.push({time:n.startSec, notes:[n]});
      } else {
        last.notes.push(n);
      }
    }
  }

  function lowerBoundStart(t){
    let lo=0, hi=notes.length;
    while(lo<hi){
      const mid=(lo+hi)>>1;
      if(notes[mid].startSec < t) lo=mid+1;
      else hi=mid;
    }
    return lo;
  }

  function groupAtOrAfter(t){
    let lo=0, hi=groups.length;
    while(lo<hi){
      const mid=(lo+hi)>>1;
      if(groups[mid].time < t) lo=mid+1;
      else hi=mid;
    }
    return Math.min(lo, groups.length-1);
  }

  function groupBefore(t){
    let lo=0, hi=groups.length;
    while(lo<hi){
      const mid=(lo+hi)>>1;
      if(groups[mid].time < t) lo=mid+1;
      else hi=mid;
    }
    return Math.max(0, lo-1);
  }

  function midiName(pitch){
    const names=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
    return names[pitch%12] + (Math.floor(pitch/12)-1);
  }

  function setSamplerVolume(){
    if(!sampler) return;
    const preset = pianoPresets[pianoPreset.value] || pianoPresets.warmfelt;
    sampler.volume.value = volume <= 0 ? -80 : 20*Math.log10(volume) + preset.volumeTrim;
  }

  function applyPianoPreset(){
    const preset = pianoPresets[pianoPreset.value] || pianoPresets.warmfelt;
    if(pianoFilter){
      pianoFilter.type = 'lowpass';
      pianoFilter.frequency.value = preset.filterFreq;
      pianoFilter.Q.value = 0.45;
    }
    if(pianoEQ){
      pianoEQ.low.value = preset.eqLow;
      pianoEQ.mid.value = preset.eqMid;
      pianoEQ.high.value = preset.eqHigh;
    }
    if(pianoCompressor){
      pianoCompressor.threshold.value = preset.threshold;
      pianoCompressor.ratio.value = preset.ratio;
      pianoCompressor.attack.value = 0.003;
      pianoCompressor.release.value = 0.18;
    }
    if(sampler){
      sampler.release = preset.release;
    }
    setSamplerVolume();
  }

  function initPiano(){
    if(typeof Tone === 'undefined'){
      samplerFailed = true;
      pianoStatus.textContent = 'Grand piano: unavailable';
      return;
    }

    pianoFilter = new Tone.Filter();
    pianoEQ = new Tone.EQ3();
    pianoCompressor = new Tone.Compressor();

    sampler = new Tone.Sampler({
      urls: {
        'A0':'A0.mp3',
        'C1':'C1.mp3', 'D#1':'Ds1.mp3', 'F#1':'Fs1.mp3', 'A1':'A1.mp3',
        'C2':'C2.mp3', 'D#2':'Ds2.mp3', 'F#2':'Fs2.mp3', 'A2':'A2.mp3',
        'C3':'C3.mp3', 'D#3':'Ds3.mp3', 'F#3':'Fs3.mp3', 'A3':'A3.mp3',
        'C4':'C4.mp3', 'D#4':'Ds4.mp3', 'F#4':'Fs4.mp3', 'A4':'A4.mp3',
        'C5':'C5.mp3', 'D#5':'Ds5.mp3', 'F#5':'Fs5.mp3', 'A5':'A5.mp3',
        'C6':'C6.mp3', 'D#6':'Ds6.mp3', 'F#6':'Fs6.mp3', 'A6':'A6.mp3',
        'C7':'C7.mp3', 'D#7':'Ds7.mp3', 'F#7':'Fs7.mp3', 'A7':'A7.mp3',
        'C8':'C8.mp3'
      },
      attack: 0,
      release: 1.45,
      baseUrl: 'https://tonejs.github.io/audio/salamander/',
      onload: () => {
        samplerReady = true;
        samplerFailed = false;
        applyPianoPreset();
        pianoStatus.textContent = `Grand piano: ready (${pianoPresets[pianoPreset.value].label})`;
      },
      onerror: () => {
        samplerFailed = true;
        pianoStatus.textContent = 'Grand piano: load failed';
      }
    });

    sampler.chain(pianoFilter, pianoEQ, pianoCompressor, Tone.Destination);
    applyPianoPreset();

    Tone.loaded().then(() => {
      if(sampler){
        samplerReady = true;
        samplerFailed = false;
        applyPianoPreset();
        pianoStatus.textContent = `Grand piano: ready (${pianoPresets[pianoPreset.value].label})`;
      }
    }).catch(() => {
      samplerFailed = true;
      pianoStatus.textContent = 'Grand piano: load failed';
    });
  }

  async function ensureAudio(){
    if(typeof Tone === 'undefined') return false;
    try{
      await Tone.start();
      return true;
    }catch{
      return false;
    }
  }

  function stopAllVoices(){
    if(!sampler) return;
    try{ sampler.releaseAll(); }catch{}
  }

  function synthNote(pitch, velocity=90, duration=0.45, delay=0){
    if(!sampler || !samplerReady) return;
    const dur = Math.max(0.06, duration);
    const when = Tone.now() + Math.max(0,delay);
    const vel = Math.max(0.03, Math.min(1, velocity/127));
    try{
      sampler.triggerAttackRelease(midiName(pitch), dur, when, vel);
    }catch(err){
      console.warn('Piano sample playback failed', err);
    }
  }

  function currentSongTime(){
    if(!playing || typeof Tone === 'undefined') return playhead;
    return Math.min(totalDuration, anchorSongTime + (Tone.now()-anchorAudioTime)*speed);
  }

  function syncPlayhead(){
    if(playing) playhead = currentSongTime();
  }

  function startVoicesAt(t){
    stopAllVoices();
    nextNoteIndex = lowerBoundStart(t + 0.001);
    const scanStart = lowerBoundStart(Math.max(0, t-maxNoteDuration-0.1));
    for(let i=scanStart;i<notes.length && notes[i].startSec<=t+0.001;i++){
      const n=notes[i];
      if(n.pitch<NOTE_MIN || n.pitch>NOTE_MAX) continue;
      if(n.endSec > t+0.01){
        synthNote(n.pitch, n.velocity, Math.max(0.06,(n.endSec-t)/speed));
      }
    }
  }

  async function play(){
    if(!midi || !notes.length) return;
    if(!samplerReady){
      topStats.textContent = samplerFailed
        ? 'Grand-piano samples could not load. This version needs internet access.'
        : 'Grand-piano samples are still loading…';
      return;
    }
    if(!(await ensureAudio())) return;
    if(playhead >= totalDuration-0.02) playhead = 0;
    selectedGroupIndex = -1;
    stepPitches.clear();
    anchorSongTime = playhead;
    anchorAudioTime = Tone.now();
    playing = true;
    startVoicesAt(playhead);
    playBtn.textContent = '❚❚ Pause';
  }

  function pause(){
    if(!playing) return;
    syncPlayhead();
    playing = false;
    stopAllVoices();
    playBtn.textContent = '▶ Play';
  }

  function togglePlay(){
    if(playing) pause(); else play();
  }

  function seekTo(t, preservePlayState=true){
    if(!midi) return;
    const wasPlaying = playing;
    if(wasPlaying) syncPlayhead();
    playhead = Math.max(0,Math.min(totalDuration,t));
    selectedGroupIndex = -1;
    stepPitches.clear();
    stopAllVoices();

    if(wasPlaying && preservePlayState){
      anchorSongTime = playhead;
      anchorAudioTime = Tone.now();
      startVoicesAt(playhead);
    } else {
      playing = false;
      playBtn.textContent = '▶ Play';
    }
  }

  function setSpeed(value){
    const newSpeed = Math.max(0.25,Math.min(2.5,Math.round(value*20)/20));
    const wasPlaying = playing;
    if(wasPlaying) syncPlayhead();
    speed = newSpeed;
    speedSlider.value = String(speed);
    speedReadout.textContent = speed.toFixed(2)+'×';
    if(wasPlaying){
      anchorSongTime = playhead;
      anchorAudioTime = Tone.now();
      startVoicesAt(playhead);
    }
  }

  async function selectGroup(idx){
    if(!groups.length) return;
    idx = Math.max(0,Math.min(groups.length-1,idx));
    if(playing) pause();
    selectedGroupIndex = idx;
    const g = groups[idx];
    playhead = g.time;
    stepPitches = new Set(g.notes.map(n=>n.pitch).filter(p=>p>=NOTE_MIN && p<=NOTE_MAX));
    stopAllVoices();

    if(!samplerReady){
      topStats.textContent = samplerFailed
        ? 'Grand-piano samples could not load. This version needs internet access.'
        : 'Grand-piano samples are still loading…';
      return;
    }
    if(!(await ensureAudio())) return;

    for(const n of g.notes){
      if(n.pitch<NOTE_MIN || n.pitch>NOTE_MAX) continue;
      const natural = Math.max(0.18, Math.min(0.70, n.endSec-n.startSec));
      synthNote(n.pitch,n.velocity,natural);
    }
  }

  function stepNext(){
    if(!midi || !groups.length) return;
    if(playing){ seekTo(currentSongTime()+2); return; }
    let idx;
    if(selectedGroupIndex >= 0) idx = selectedGroupIndex+1;
    else idx = groupAtOrAfter(playhead + 0.001);
    selectGroup(idx);
  }

  function stepPrev(){
    if(!midi || !groups.length) return;
    if(playing){ seekTo(currentSongTime()-2); return; }
    let idx;
    if(selectedGroupIndex >= 0) idx = selectedGroupIndex-1;
    else idx = groupBefore(playhead - 0.001);
    selectGroup(idx);
  }

  function tempoAtSec(sec){
    if(!midi || midi.smpte || !tempoMap.length) return null;
    let lo=0, hi=tempoMap.length-1;
    while(lo<hi){
      const mid=Math.ceil((lo+hi)/2);
      if(tempoMap[mid].sec <= sec) lo=mid;
      else hi=mid-1;
    }
    return 60e6/tempoMap[lo].usq;
  }

  function isWhitePitch(p){ return WHITE_PCS.has(p%12); }

  function rebuildKeyboard(){
    whiteKeys = [];
    blackKeys = [];
    keyLayout = new Array(128);

    let whiteIndex = 0;
    const whiteW = W/52;
    const blackW = whiteW*0.62;

    for(let p=NOTE_MIN;p<=NOTE_MAX;p++){
      if(isWhitePitch(p)){
        const key={pitch:p,x:whiteIndex*whiteW,w:whiteW,white:true};
        whiteKeys.push(key); keyLayout[p]=key;
        whiteIndex++;
      } else {
        const x=whiteIndex*whiteW-blackW/2;
        const key={pitch:p,x,w:blackW,white:false};
        blackKeys.push(key); keyLayout[p]=key;
      }
    }
  }

  function resize(){
    const r=main.getBoundingClientRect();
    dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
    W=Math.max(1,r.width);
    H=Math.max(1,r.height);
    canvas.width=Math.round(W*dpr);
    canvas.height=Math.round(H*dpr);
    canvas.style.width=W+'px';
    canvas.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);

    keyboardH=Math.max(115,Math.min(185,H*0.24));
    fieldH=H-keyboardH;
    pxPerSec=Math.max(115,Math.min(210,fieldH/3.6));
    rebuildKeyboard();
  }

  function roundRect(x,y,w,h,r){
    const rr=Math.min(r,w/2,h/2);
    ctx.beginPath();
    ctx.moveTo(x+rr,y);
    ctx.arcTo(x+w,y,x+w,y+h,rr);
    ctx.arcTo(x+w,y+h,x,y+h,rr);
    ctx.arcTo(x,y+h,x,y,rr);
    ctx.arcTo(x,y,x+w,y,rr);
    ctx.closePath();
  }

  function noteX(n){
    const k=keyLayout[n.pitch];
    if(!k) return null;
    const width = k.white ? k.w*0.70 : k.w*0.92;
    return {x:k.x+(k.w-width)/2,w:width};
  }

  function activePitchesAt(t){
    if(!midi) return new Set();
    if(!playing && selectedGroupIndex>=0) return stepPitches;

    const s=new Set();
    const start=lowerBoundStart(Math.max(0,t-maxNoteDuration-0.05));
    for(let i=start;i<notes.length;i++){
      const n=notes[i];
      if(n.startSec > t+0.001) break;
      if(n.endSec > t && n.pitch>=NOTE_MIN && n.pitch<=NOTE_MAX) s.add(n.pitch);
    }
    return s;
  }

  function cssVar(name){
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function initTheme(){
    theme = {
      fieldTop: cssVar('--field-top'),
      fieldMid: cssVar('--field-mid'),
      fieldBottom: cssVar('--field-bottom'),
      laneMajor: cssVar('--lane-major'),
      laneMinor: cssVar('--lane-minor'),
      gridMajor: cssVar('--grid-major'),
      gridMinor: cssVar('--grid-minor'),
      strike: cssVar('--strike'),
      strikeBright: cssVar('--strike-bright'),
      whiteKey: cssVar('--white-key'),
      whiteKey2: cssVar('--white-key-2'),
      whiteKeyActive1: cssVar('--white-key-active-1'),
      whiteKeyActive2: cssVar('--white-key-active-2'),
      blackKey1: cssVar('--black-key-1'),
      blackKey2: cssVar('--black-key-2'),
      blackKeyActive1: cssVar('--black-key-active-1'),
      blackKeyActive2: cssVar('--black-key-active-2'),
      note1: cssVar('--note-1'),
      note2: cssVar('--note-2'),
      note3: cssVar('--note-3'),
      noteHi1: cssVar('--note-hi-1'),
      noteHi2: cssVar('--note-hi-2'),
      noteHi3: cssVar('--note-hi-3'),
      text: cssVar('--text'),
      muted: cssVar('--muted')
    };
  }

  function draw(t){
    ctx.clearRect(0,0,W,H);

    const bg=ctx.createLinearGradient(0,0,0,fieldH);
    bg.addColorStop(0,theme.fieldTop);
    bg.addColorStop(.55,theme.fieldMid);
    bg.addColorStop(1,theme.fieldBottom);
    ctx.fillStyle=bg;
    ctx.fillRect(0,0,W,fieldH);

    const aura=ctx.createRadialGradient(W/2,fieldH*0.86,20,W/2,fieldH*0.86,Math.max(160,W*0.45));
    aura.addColorStop(0,'#b4fff20f');
    aura.addColorStop(.45,'#6fb1d10b');
    aura.addColorStop(1,'#00000000');
    ctx.fillStyle=aura;
    ctx.fillRect(0,0,W,fieldH);

    const whiteW=W/52;
    ctx.lineWidth=1;
    for(let i=0;i<=52;i++){
      const x=Math.round(i*whiteW)+0.5;
      ctx.strokeStyle = i%7===0 ? theme.laneMajor : theme.laneMinor;
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,fieldH); ctx.stroke();
    }

    const span=fieldH/pxPerSec;
    const first=Math.floor(t);
    ctx.font='11px Inter, Arial, sans-serif';
    ctx.textBaseline='bottom';
    for(let s=first;s<=t+span+1;s++){
      if(s < t) continue;
      const y=fieldH-(s-t)*pxPerSec;
      ctx.strokeStyle=(s%5===0)?theme.gridMajor:theme.gridMinor;
      ctx.beginPath(); ctx.moveTo(0,Math.round(y)+0.5); ctx.lineTo(W,Math.round(y)+0.5); ctx.stroke();
      if(s%5===0){
        ctx.fillStyle=theme.muted;
        ctx.fillText(formatTime(s),5,y-4);
      }
    }

    if(midi && notes.length){
      const earliest=Math.max(0,t-maxNoteDuration-LOOKBACK_PADDING_SEC);
      const i0=lowerBoundStart(earliest);
      const latest=t+span+0.15;

      for(let i=i0;i<notes.length;i++){
        const n=notes[i];
        if(n.startSec>latest) break;
        if(n.pitch<NOTE_MIN || n.pitch>NOTE_MAX) continue;

        const nx=noteX(n);
        if(!nx) continue;

        const yBottom=fieldH-(n.startSec-t)*pxPerSec;
        const yTop=yBottom-(n.endSec-n.startSec)*pxPerSec;
        if(yBottom<0 || yTop>fieldH) continue;

        const top=Math.max(1,yTop);
        const bottom=Math.min(fieldH-1,yBottom);
        const h=Math.max(4,bottom-top);
        const isCurrent = n.startSec<=t && n.endSec>t;

        ctx.save();
        ctx.shadowColor = isCurrent ? theme.noteHi2 : '#0008';
        ctx.shadowBlur = isCurrent ? 14 : 5;

        const grad=ctx.createLinearGradient(nx.x,0,nx.x+nx.w,0);
        if(isCurrent){
          grad.addColorStop(0, theme.noteHi1);
          grad.addColorStop(.52, theme.noteHi2);
          grad.addColorStop(1, theme.noteHi3);
        } else {
          grad.addColorStop(0, theme.note1);
          grad.addColorStop(.5, theme.note2);
          grad.addColorStop(1, theme.note3);
        }

        ctx.fillStyle=grad;
        roundRect(nx.x,top,nx.w,h,Math.min(6,nx.w*.28));
        ctx.fill();
        ctx.strokeStyle = isCurrent ? '#ffffff96' : '#d9f7ff42';
        ctx.lineWidth=1;
        ctx.stroke();

        if(isCurrent){
          ctx.fillStyle='#ffffff1f';
          roundRect(nx.x+1.5, top+1.5, Math.max(2,nx.w-3), Math.max(2, h*0.15), Math.min(5,nx.w*.2));
          ctx.fill();
        }
        ctx.restore();
      }
    }

    ctx.fillStyle=theme.strike;
    ctx.fillRect(0,fieldH-3,W,3);
    ctx.fillStyle=theme.strikeBright;
    ctx.fillRect(0,fieldH-2,W,1);

    const ky=fieldH;
    const active=activePitchesAt(t);

    ctx.fillStyle=theme.whiteKey;
    ctx.fillRect(0,ky,W,keyboardH);

    for(const k of whiteKeys){
      const kg=ctx.createLinearGradient(0,ky,0,ky+keyboardH);
      if(active.has(k.pitch)){
        kg.addColorStop(0,theme.whiteKeyActive1);
        kg.addColorStop(1,theme.whiteKeyActive2);
      } else {
        kg.addColorStop(0,theme.whiteKey);
        kg.addColorStop(1,theme.whiteKey2);
      }
      ctx.fillStyle=kg;
      ctx.fillRect(k.x+0.5,ky+0.5,k.w-1,keyboardH-1);

      ctx.strokeStyle='#243138';
      ctx.lineWidth=1;
      ctx.strokeRect(Math.floor(k.x)+.5,ky+.5,Math.ceil(k.w),keyboardH-1);

      if(k.pitch%12===0){
        const oct=Math.floor(k.pitch/12)-1;
        ctx.fillStyle=active.has(k.pitch)?'#12343c':'#607078';
        ctx.font=`${Math.max(8,Math.min(11,k.w*.7))}px Inter, Arial, sans-serif`;
        ctx.textAlign='center';
        ctx.textBaseline='bottom';
        ctx.fillText('C'+oct,k.x+k.w/2,ky+keyboardH-5);
      }
    }

    const blackH=keyboardH*0.62;
    for(const k of blackKeys){
      const g=ctx.createLinearGradient(0,ky,0,ky+blackH);
      if(active.has(k.pitch)){
        g.addColorStop(0,theme.blackKeyActive1);
        g.addColorStop(1,theme.blackKeyActive2);
      } else {
        g.addColorStop(0,theme.blackKey1);
        g.addColorStop(1,theme.blackKey2);
      }
      ctx.fillStyle=g;
      ctx.fillRect(k.x,ky,k.w,blackH);
      ctx.strokeStyle='#000';
      ctx.lineWidth=1;
      ctx.strokeRect(Math.floor(k.x)+.5,ky+.5,Math.ceil(k.w),blackH-1);
      ctx.fillStyle=active.has(k.pitch)?'#ffffff40':'#ffffff10';
      ctx.fillRect(k.x+2,ky+2,Math.max(0,k.w-4),3);
    }

    for(const p of active){
      const k=keyLayout[p];
      if(!k) continue;
      const cx=k.x+k.w/2;
      const glow=ctx.createRadialGradient(cx,fieldH,0,cx,fieldH,22);
      glow.addColorStop(0,'#b94b6fc9');
      glow.addColorStop(1,'#7B1B3800');
      ctx.fillStyle=glow;
      ctx.fillRect(cx-24,fieldH-22,48,30);
    }

    ctx.textAlign='left';
  }

  function formatTime(sec){
    sec=Math.max(0,sec||0);
    const m=Math.floor(sec/60);
    const s=sec-m*60;
    return `${m}:${s.toFixed(1).padStart(4,'0')}`;
  }

  function updateUI(t){
    if(midi){
      progress.max=String(Math.max(0.001,totalDuration));
      if(!progress.matches(':active')) progress.value=String(Math.min(totalDuration,t));
      timeEl.textContent=`${formatTime(t)} / ${formatTime(totalDuration)}`;
      const bpm=tempoAtSec(t);
      const groupText = selectedGroupIndex>=0 ? ` · group ${selectedGroupIndex+1}/${groups.length}` : '';
      topStats.textContent=`${notes.length.toLocaleString()} notes · ${groups.length.toLocaleString()} groups${bpm?` · ${bpm.toFixed(1)} BPM`:''}${groupText}`;
      if(samplerReady){
        pianoStatus.textContent = `Grand piano: ready (${pianoPresets[pianoPreset.value].label})`;
      }
    }
  }

  function playbackTick(){
    if(playing && midi){
      const t=currentSongTime();
      playhead=t;

      while(nextNoteIndex<notes.length && notes[nextNoteIndex].startSec<=t+0.002){
        const n=notes[nextNoteIndex++];
        if(n.pitch>=NOTE_MIN && n.pitch<=NOTE_MAX && n.endSec>t){
          synthNote(n.pitch,n.velocity,Math.max(0.06,(n.endSec-t)/speed));
        }
      }

      if(t>=totalDuration-0.001){
        playhead=totalDuration;
        playing=false;
        stopAllVoices();
        playBtn.textContent='▶ Play';
      }
    }

    const t=playing?currentSongTime():playhead;
    draw(t);
    updateUI(t);
    requestAnimationFrame(playbackTick);
  }

  async function loadFile(file){
    if(!file) return;
    try{
      pause();
      topStats.textContent='Parsing MIDI…';
      const buf=await file.arrayBuffer();
      const parsed=parseMidi(buf);
      midi=parsed;
      notes=parsed.notes;
      tempoMap=parsed.tempoMap;
      totalDuration=parsed.duration;
      maxNoteDuration=Math.max(0.1,...notes.map(n=>Math.min(60,n.endSec-n.startSec)));
      buildGroups();

      playhead=0;
      selectedGroupIndex=-1;
      stepPitches.clear();
      nextNoteIndex=0;
      progress.max=String(Math.max(.001,totalDuration));
      progress.value='0';
      fileNameEl.textContent=file.name;
      dropHint.classList.add('hidden');
      topStats.textContent=`${notes.length.toLocaleString()} notes · ${groups.length.toLocaleString()} groups`;
    } catch(err){
      console.error(err);
      midi=null; notes=[]; groups=[]; totalDuration=0; playhead=0;
      topStats.textContent='Could not load MIDI: '+err.message;
      fileNameEl.textContent='—';
      dropHint.classList.remove('hidden');
      alert('Could not load this MIDI file:\n\n'+err.message);
    }
  }

  fileInput.addEventListener('change',e=>loadFile(e.target.files[0]));
  playBtn.addEventListener('click',togglePlay);
  nextBtn.addEventListener('click',stepNext);
  prevBtn.addEventListener('click',stepPrev);
  slowerBtn.addEventListener('click',()=>setSpeed(speed-0.10));
  fasterBtn.addEventListener('click',()=>setSpeed(speed+0.10));
  speedSlider.addEventListener('input',()=>setSpeed(parseFloat(speedSlider.value)));
  volumeSlider.addEventListener('input',()=>{
    volume = parseFloat(volumeSlider.value);
    setSamplerVolume();
  });
  pianoPreset.addEventListener('change',()=>{
    applyPianoPreset();
    if(samplerReady) pianoStatus.textContent = `Grand piano: ready (${pianoPresets[pianoPreset.value].label})`;
  });

  progress.addEventListener('input',()=>{
    if(!midi) return;
    seekTo(parseFloat(progress.value), true);
  });

  document.addEventListener('keydown',e=>{
    if(e.target && ['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName) && e.target!==progress) return;
    if(e.code==='Space'){
      e.preventDefault(); togglePlay();
    } else if(e.code==='ArrowRight'){
      e.preventDefault(); stepNext();
    } else if(e.code==='ArrowLeft'){
      e.preventDefault(); stepPrev();
    } else if(e.code==='ArrowUp'){
      e.preventDefault(); setSpeed(speed+0.10);
    } else if(e.code==='ArrowDown'){
      e.preventDefault(); setSpeed(speed-0.10);
    } else if(e.code==='Home'){
      e.preventDefault(); seekTo(0,false);
    } else if(e.code==='End' && midi){
      e.preventDefault(); seekTo(totalDuration,false);
    }
  });

  for(const ev of ['dragenter','dragover']){
    main.addEventListener(ev,e=>{
      e.preventDefault();
      dropHint.textContent='Drop MIDI to open';
      dropHint.classList.remove('hidden');
    });
  }
  main.addEventListener('dragleave',e=>{
    e.preventDefault();
    if(midi) dropHint.classList.add('hidden');
    else dropHint.textContent='Drop a .mid / .midi file here';
  });
  main.addEventListener('drop',e=>{
    e.preventDefault();
    const file=e.dataTransfer.files && e.dataTransfer.files[0];
    if(file) loadFile(file);
  });

  window.addEventListener('resize',resize);
  resize();
  initTheme();
  setSpeed(1);
  initPiano();
  requestAnimationFrame(playbackTick);
})();
</script>
</body>
</html>
